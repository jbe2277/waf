name: NewsReader.CI

on: 
  push:
    paths: 
    - 'src/*'
    - 'src/NewsReader/**'
    - 'src/NewsReader.UITest/**'
    - '.github/workflows/**' 
    - '!.github/workflows/System.Waf.CI.yml' 

  workflow_dispatch:

jobs:
  GetVersion:
    uses: ./.github/workflows/GetBuildVersion.yml

  Android:    
    runs-on: ubuntu-latest
    needs: GetVersion
    steps:
    - name: 🔖 Check-out
      uses: actions/checkout@v6

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10'

    - name: ⚙️ Install .NET MAUI
      run: dotnet workload install maui-android

    - name: ⚙️ .NET MAUI Version info
      run: dotnet workload list
    
    - name: 📜 Prepare WebStorageService AppId
      shell: pwsh
      env:
        WebStorageServiceKeys64: ${{ secrets.WEB_STORAGE_SERVICE_KEYS64 }} 
      run: |
        [IO.File]::WriteAllBytes((Join-Path $pwd "src/NewsReader/NewsReader.Presentation/Services" "WebStorageService.keys.cs"), [Convert]::FromBase64String($env:WebStorageServiceKeys64))

    - name: 🛠️ Build
      run: |
        cd src/NewsReader/NewsReader.MauiSystem
        dotnet publish -f:net10.0-android -c:Release -p:ApplicationVersion=${{ needs.GetVersion.outputs.versionCode }} -p:ApplicationDisplayVersion=${{ needs.GetVersion.outputs.version }}
    
    - name: 📦 Upload AAB, APK
      uses: actions/upload-artifact@v6
      with:
        name: NewsReaderAndroid
        if-no-files-found: error
        path: |
          ./**/publish/*Signed.aab
          ./**/publish/*Signed.apk

  Windows:
    runs-on: windows-2025
    needs: GetVersion
    steps:
    - name: 🔖 Check-out
      uses: actions/checkout@v6

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10'

    - name: ⚙️ Install .NET MAUI
      run: dotnet workload install maui-android maui-windows maui-ios
      
    - name: ⚙️ .NET MAUI Version info
      run: dotnet workload list

    - name: 📜 Prepare WebStorageService AppId
      shell: pwsh
      env:
        WebStorageServiceKeys64: ${{ secrets.WEB_STORAGE_SERVICE_KEYS64 }} 
      run: |
        [IO.File]::WriteAllBytes((Join-Path $pwd "src/NewsReader/NewsReader.Presentation/Services" "WebStorageService.keys.cs"), [Convert]::FromBase64String($env:WebStorageServiceKeys64))

    - name: 📜 Prepare certificate
      shell: pwsh
      env:
        MSStoreLocalCert64: ${{ secrets.MS_STORE_LOCAL_CERT64 }} 
      run: |
        [IO.File]::WriteAllBytes((Join-Path $pwd "src/NewsReader/NewsReader.MauiSystem" "MSStoreLocalCert.p12"), [Convert]::FromBase64String($env:MSStoreLocalCert64))

    - name: 🛠️ Build x64
      # -p:ApplicationVersion=0 because of https://github.com/dotnet/maui/issues/18571
      run: |
        cd src/NewsReader/NewsReader.MauiSystem
        dotnet publish -f:net10.0-windows10.0.19041.0 -c:Release -p:ApplicationDisplayVersion=${{ needs.GetVersion.outputs.version }} -p:ApplicationVersion=0 -p:AppxPackageSigningEnabled=true -p:PackageCertificateKeyFile=MSStoreLocalCert.p12 --self-contained

    - name: 🛠️ Copy msix into another folder as the arm64 build will remove the folder
      shell: pwsh
      run: |
        $rootFolder = ".\src\NewsReader\NewsReader.MauiSystem\AppPackages\"
        $msixFile = Get-ChildItem -Path $rootFolder -Recurse -Filter *.msix | Select-Object -First 1
        $destination = Join-Path $rootFolder $msixFile.Name
        Copy-Item -Path $msixFile.FullName -Destination $destination

    - name: 🛠️ Build arm64
      run: |
        cd src/NewsReader/NewsReader.MauiSystem
        dotnet publish -f:net10.0-windows10.0.19041.0 -c:Release -p:RuntimeIdentifierOverride=win-arm64 -p:ApplicationDisplayVersion=${{ needs.GetVersion.outputs.version }} -p:ApplicationVersion=0 -p:AppxPackageSigningEnabled=true -p:PackageCertificateKeyFile=MSStoreLocalCert.p12 --self-contained
  
    - name: 📦 Upload MSIX
      uses: actions/upload-artifact@v6
      with:
        name: NewsReaderWindows
        if-no-files-found: error
        path: |
          ./**/AppPackages/**/NewsReader*.msix
    
  iOS:
    runs-on: macos-26
    needs: GetVersion
    steps:
    - name: 🔖 Check-out
      uses: actions/checkout@v6

    - name: ⚙️ Set Xcode version
      run: |
        XCODE_ROOT=/Applications/Xcode_26.6.app
        echo "MD_APPLE_SDK_ROOT=$XCODE_ROOT" >> $GITHUB_ENV       # set environment variable to specify Xcode for Mono and Xamarin
        sudo xcode-select -s $XCODE_ROOT
    
    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10'
    
    - name: ⚙️ Install .NET MAUI
      run: dotnet workload install maui-android maui-ios

    - name: 📜 Prepare WebStorageService AppId
      shell: pwsh
      env:
        WebStorageServiceKeys64: ${{ secrets.WEB_STORAGE_SERVICE_KEYS64 }} 
      run: |
        [IO.File]::WriteAllBytes((Join-Path $pwd "src/NewsReader/NewsReader.Presentation/Services" "WebStorageService.keys.cs"), [Convert]::FromBase64String($env:WebStorageServiceKeys64))

    - name: 🛠️ Build
      run: |
        cd src/NewsReader/NewsReader.MauiSystem
        dotnet build -f net10.0-ios -c:Release -p:RuntimeIdentifier=iossimulator-arm64 -p:ApplicationVersion=${{ needs.GetVersion.outputs.version }} -p:ApplicationDisplayVersion=${{ needs.GetVersion.outputs.version }}

    - name: 📦 Upload iOS App for simulator
      uses: actions/upload-artifact@v6
      with:
        name: NewsReaderiOSSimulator
        if-no-files-found: error
        path: |
          ./src/NewsReader/NewsReader.MauiSystem/bin/Release/*/iossimulator-arm64/NewsReader.MauiSystem.app/**
        
  UnitTest:
    runs-on: ubuntu-latest
    needs: GetVersion
    steps:
    - name: 🔖 Check-out
      uses: actions/checkout@v6

    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10'

    - name: ⚙️ Install .NET MAUI
      run: dotnet workload install maui-android
  
    - name: 🕵️ Test
      run: |
        echo "## 🕵️ Test Results" >> $Env:GITHUB_STEP_SUMMARY
        cd ./src/NewsReader
        dotnet test --solution ./NewsReader.slnx -c:Release -p:Version=${{ needs.GetVersion.outputs.version }}

  AndroidUITest:
    runs-on: ubuntu-latest
    needs: Android
    steps:
    - name: 🔖 Check-out
      uses: actions/checkout@v6

    - name: 📦 Download APK
      uses: actions/download-artifact@v8
      with:
        name: NewsReaderAndroid
        path: ./NewsReaderAndroid

    - name: ⚙️ Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: ⚙️ Start Android Emulator
      run: |
        export PATH="$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
      
        echo "Installing system image"
        echo "y" | sdkmanager "system-images;android-35;google_atd;x86_64"

        echo "Setting ANDROID_AVD_HOME"
        export ANDROID_AVD_HOME=$HOME/.config/.android/avd

        echo "Creating AVD"
        echo "no" | avdmanager create avd -n test_emulator -k "system-images;android-35;google_atd;x86_64" --device "pixel_7" --force

        echo "Starting emulator"
        emulator -avd test_emulator -no-audio -no-boot-anim -no-window -no-snapshot &

    - name: ⚙️ Install Appium Server
      run: |
        npm install appium -g
        appium driver install uiautomator2
        appium --version

    - name: ⚙️ Start Appium Server
      run: |
        mkdir -p $GITHUB_WORKSPACE/out/NewsReader.UITest
        appium > $GITHUB_WORKSPACE/out/NewsReader.UITest/appium.log 2>&1 &

    - name: ⚙️ Wait for Android Emulator to complete booting
      run: |
        export PATH="$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
        adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 5; done; input keyevent 82'

    - name: 🖥️ UI Test
      env:
        UITestApkFile: NewsReaderAndroid/src/NewsReader/NewsReader.MauiSystem/bin/Release/net10.0-android/publish/Waf.NewsReader-Signed.apk
      run: |
        echo "## 🕵️ Test Results - NewsReader.UITest.sln" >> $Env:GITHUB_STEP_SUMMARY        
        cd ./src/NewsReader.UITest
        dotnet test --solution ./NewsReader.UITest.slnx --filter-trait DevicePlatform=Android

    - name: 📦 Upload UI Test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: NewsReaderUITestResults
        if-no-files-found: ignore
        path: |
          out/NewsReader.UITest/
  
  iOSUITest:
    runs-on: macos-26
    needs: iOS
    steps:
    - name: 🔖 Check-out
      uses: actions/checkout@v6

    - name: 📦 Download Simulator App
      uses: actions/download-artifact@v8
      with:
        name: NewsReaderiOSSimulator
        path: ./NewsReaderiOSSimulator  

    - name: ⚙️ Show available simulators 
      run: xcrun simctl list devices available

    - name: ⚙️ Create and boot simulator and install app
      run: |
        DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-17"
        RUNTIME=$(xcrun simctl list runtimes | grep 'iOS 26.4' | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*' | head -1)
        UDID=$(xcrun simctl create "CI iPhone" "$DEVICE_TYPE" "$RUNTIME")
        echo "UITestDeviceId=$UDID" >> "$GITHUB_ENV"
        xcrun simctl boot "$UDID"
        open -a Simulator   # <-- open the UI so Appium doesn't need to restart it
        xcrun simctl bootstatus "$UDID" -b
        xcrun simctl install "$UDID" NewsReaderiOSSimulator/net10.0-ios/iossimulator-arm64/NewsReader.MauiSystem.app

    - name: ⚙️ Install Appium Server
      run: |
        npm install appium -g
        appium driver install xcuitest
        appium --version

    - name: ⚙️ Start Appium Server
      run: |
        mkdir -p $GITHUB_WORKSPACE/out/NewsReader.UITest
        appium > $GITHUB_WORKSPACE/out/NewsReader.UITest/appium.log 2>&1 &

    - name: 🖥️ UI Test
      env:
        UITestApp: NewsReaderiOSSimulator/net10.0-ios/iossimulator-arm64/NewsReader.MauiSystem.app
      run: |
        echo "## 🕵️ Test Results - NewsReader.UITest.sln" >> $Env:GITHUB_STEP_SUMMARY
        cd ./src/NewsReader.UITest
        dotnet test --solution ./NewsReader.UITest.slnx --filter-trait DevicePlatform=IOS

    - name: 📦 Upload UI Test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: NewsReaderUITestResults
        if-no-files-found: ignore
        path: |
          out/NewsReader.UITest/

  WindowsUITest:
    runs-on: windows-2025
    needs: Windows
    steps:
    - name: 🔖 Check-out
      uses: actions/checkout@v6

    - name: 📦 Download Windows App
      uses: actions/download-artifact@v8
      with:
        name: NewsReaderWindows
        path: ./NewsReaderWindows

    - name: ⚙️ Install App
      shell: pwsh
      run: |
        $rootFolder = "./NewsReaderWindows"
        $msixFile = Get-ChildItem -Path $rootFolder -Recurse -Filter *x64.msix | Select-Object -First 1
        Export-Certificate -Cert (Get-AuthenticodeSignature -FilePath $msixFile).SignerCertificate -FilePath ".\App.cer"
        Import-Certificate -FilePath ".\App.cer" -CertStoreLocation "Cert:\LocalMachine\TrustedPeople"
        Add-AppxPackage -Path $msixFile
        Get-AppxPackage -Name Waf.NewsReader
    
    - name: ⚙️ Install Appium Server
      shell: pwsh  
      run: |
        npm install -g appium
        appium driver install windows
        appium --version

    - name: ⚙️ Start Appium Server
      shell: bash
      run: appium &
      
    - name: 🖥️ UI Test
      run: |
        echo "## 🕵️ Test Results - NewsReader.UITest.slnx" >> $Env:GITHUB_STEP_SUMMARY
        cd ./src/NewsReader.UITest
        dotnet test --solution ./NewsReader.UITest.slnx --filter-trait "DevicePlatform=Windows"

    - name: 📦 Upload UI Test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: NewsReaderUITestResults
        if-no-files-found: ignore
        path: |
          out/NewsReader.UITest/